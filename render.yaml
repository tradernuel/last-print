# Render Blueprint for the Last Print game server (the website stays on Vercel).
# Needs a paid instance: the server must run 24/7 and keep its database on a persistent disk.
services:
  - type: web
    name: last-print-server
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run start -w @last-print/server
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: MONAD_RPC_HTTP
        value: https://rpc.monad.xyz
      - key: WRITES_ENABLED
        value: "false"
      - key: HYPERSYNC_TOKEN
        sync: false
      - key: OPENSEA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
