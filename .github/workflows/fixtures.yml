name: fetch-fixtures
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run fixtures:fetch
        env:
          MONAD_RPC_HTTP: https://rpc.monad.xyz
      - name: Commit fixtures
        run: |
          git config user.name "tradernuel"
          git config user.email "134220128+tradernuel@users.noreply.github.com"
          git add packages/core/test/fixtures
          git diff --cached --quiet || git commit -m "test: real-transaction fixtures from Monad mainnet"
          git push
