name: art
on: workflow_dispatch

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
      ART_BUDGET_MIN: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Mirror Chog art and sample Background colours
        run: node --experimental-strip-types scripts/m0/art.ts
      - name: Save progress (runs even if some images are missing)
        if: always()
        run: |
          git config user.name "tradernuel"
          git config user.email "134220128+tradernuel@users.noreply.github.com"
          for d in apps/web/public/art data/art; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "art: mirror Chog images (512 and 256 px) and Background colours"
          git pull --rebase
          git push
